<html>
    <head>
        <link rel = "stylesheet" href = "birthdaystyle.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com/%22%3E" >
        <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
</head>
    <body>
        <div id="header">
            <h1>Today is Muco's birthday</h1>
            <img id=bff-img src="https://storcpdkenticomedia.blob.core.windows.net/media/recipemanagementsystem/media/recipe-media-files/recipes/retail/x17/16714-birthday-cake-600x600.jpg?ext=.jpg">

            <h4 id="date">15.06.2023</h4>
        </div>
        <div class="gift">
            <h2 class="title">Here's how happy I am for you today</h2>
            <h3 class="hint">(Hover over the gift)</h3>
            <div class="box" id="first"></div>
        </div>
        <div class="gift">
            <h2 class="title">How people react when you enter the room</h2>
            <div class="box" id="second"></div>
        </div>
        <div class="gift">
            <h2 class="title">Cheers!</h2>
            <div class="box" id="third"></div>
        </div>
        <p id="footer">Click <a href="https://www.youtube.com/watch?v=h3r9myZYADc">here</a> for party song :)</p>
